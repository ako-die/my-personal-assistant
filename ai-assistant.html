<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI Assistant - My Personal Assistant</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f7f3ff;
      color: #17324d;
      min-height: 100vh;
    }

    .app {
      max-width: 480px;
      margin: auto;
      min-height: 100vh;
      padding: 20px;
    }

    .header {
      text-align: center;
      padding: 25px 15px;
    }

    .header .icon {
      font-size: 50px;
      margin-bottom: 10px;
    }

    .header h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .header p {
      font-size: 15px;
      color: #666;
    }

    .content {
      background: white;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .welcome {
      text-align: center;
      margin-bottom: 25px;
    }

    .welcome h2 {
      margin-bottom: 10px;
    }

    .welcome p {
      color: #666;
      line-height: 1.5;
    }
.ai-menu {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-top: 20px;
}

.ai-item {
    width: 100%;
    border: 1px solid #e5dff5;
    border-radius: 16px;
    padding: 16px;
    background: #ffffff;
    color: #17324d;
    text-align: left;
    cursor: pointer;
    box-shadow: 0 3px 10px rgba(0,0,0,0.06);
}

.ai-item strong {
    display: block;
    font-size: 17px;
    margin-bottom: 6px;
}

.ai-item span {
    display: block;
    font-size: 14px;
    color: #666;
    line-height: 1.4;
}
    .back {
      width: 100%;
      border: none;
      border-radius: 15px;
      padding: 16px;
      margin-top: 20px;
      font-size: 16px;
      font-weight: bold;
      background: #e9dcff;
      color: #17324d;
      cursor: pointer;
    }

    .footer {
      text-align: center;
      margin-top: 35px;
      padding-bottom: 20px;
    }

    .footer .brand {
      font-size: 22px;
      font-weight: bold;
      color: #6b3fa0;
    }

    .footer small {
      display: block;
      margin-top: 8px;
      color: #888;
    }
  </style>
</head>

<body>

<div class="app">

    <div class="header">
        <div class="icon">🤖</div>
        <h1>AI Assistant</h1>
        <p>Asisten AI untuk membantu pekerjaan.</p>
    </div>

    <div class="content">

        <div class="welcome">
            <h2>👋 Selamat Datang</h2>
            <p>
                AI Assistant siap membantu pekerjaan Anda
                agar lebih praktis dan teratur.
            </p>
        </div>

        <div class="ai-menu">

          <button class="ai-item" onclick="window.location.href='/my-personal-assistant/catatan.html'">
                📝
                <strong>Buat Catatan</strong>
                <span>Membuat dan menyimpan catatan pekerjaan.</span>
            </button>

            <button class="ai-item">
                📋
                <strong>Buat To-Do</strong>
                <span>Membuat daftar pekerjaan yang harus dilakukan.</span>
            </button>

            <button class="ai-item">
                💡
                <strong>Bantu Pekerjaan</strong>
                <span>Membantu mencari ide dan solusi pekerjaan.</span>
            </button>

            <button class="ai-item">
                📊
                <strong>Ringkasan Pekerjaan</strong>
                <span>Membantu merangkum aktivitas dan pekerjaan.</span>
            </button>

        </div>

        <button class="back" onclick="kembali()">
            ← Kembali ke Menu Utama
        </button>

    </div>

    <div class="footer">
        <div class="brand">My Personal Assistant</div>
        <small>Created by Dee</small>
    </div>

</div>

  <script>
    function kembali() {
      window.location.href = "index.html";
    }
  </script>

</body>
</html>
