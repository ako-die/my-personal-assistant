huu<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Buat To-Do - My Personal Assistant</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f7f3ff;
    color: #17324d;
    min-height: 100vh;
}

.app {
    max-width: 480px;
    margin: auto;
    min-height: 100vh;
    padding: 20px;
}

.header {
    text-align: center;
    padding: 25px 15px;
}

.header .icon {
    font-size: 50px;
    margin-bottom: 10px;
}

.header h1 {
    font-size: 28px;
    margin-bottom: 8px;
}

.header p {
    font-size: 15px;
    color: #666;
}

.content {
    background: white;
    border-radius: 20px;
    padding: 25px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

.content h2 {
    text-align: center;
    margin-bottom: 20px;
}

input,
select {
    width: 100%;
    padding: 15px;
    border: 1px solid #ddd;
    border-radius: 15px;
    margin-bottom: 15px;
    font-size: 16px;
    outline: none;
}

input:focus,
select:focus {
    border-color: #b69cff;
}

button {
    width: 100%;
    border: none;
    border-radius: 15px;
    padding: 15px;
    margin-top: 15px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.save {
    background: #e9dcff;
    color: #17324d;
}

.back {
    background: #e9dcff;
    color: #17324d;
}

.notes {
    margin-top: 25px;
}

.note {
    background: #fafafa;
    border: 1px solid #e5dff5;
    border-radius: 15px;
    padding: 15px;
    margin-top: 12px;
}

.note p {
    white-space: pre-wrap;
    line-height: 1.5;
    margin: 0;
}

.note small {
    display: block;
    margin-top: 8px;
    color: #888;
}

.delete {
    background: #ffe4e4;
    color: #a33;
    padding: 10px;
    margin-top: 10px;
}
}
.footer {
    text-align: center;
    margin-top: 35px;
    padding-bottom: 20px;
}

.footer .brand {
    font-size: 22px;
    font-weight: bold;
    color: #6b3fa0;
}

.footer small {
    display: block;
    margin-top: 8px;
    color: #888;
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="icon">📋</div>
    <h1>Buat To-Do</h1>
    <p>Daftar pekerjaan yang harus Anda lakukan.</p>
  </div>

  <div class="content">

    <h2>To-Do Baru</h2>

    <input
      type="text"
      id="todoInput"
      placeholder="Tulis pekerjaan di sini..."
    >

    <button class="save" onclick="tambahTodo()">
      ➕ Tambah To-Do
    </button>

    <div class="notes">
      <h2>Daftar To-Do</h2>
      <div id="daftarTodo"></div>
    </div>

    <button class="back" onclick="kembali()">
      ← Kembali ke AI Assistant
    </button>

  </div>

  <div class="footer">
    <div class="brand">My Personal Assistant</div>
    <small>Created by Dee</small>
  </div>

</div> 
    <script>

function ambilTodo() {
  return JSON.parse(localStorage.getItem("daftarTodo") || "[]");
}

function tambahTodo() {
  const input = document.getElementById("todoInput");
  const isi = input.value.trim();

  if (isi === "") {
    alert("Silakan tulis pekerjaan terlebih dahulu.");
    return;
  }

  const todo = ambilTodo();

  todo.push({
    tugas: isi,
    waktu: new Date().toLocaleString("id-ID")
  });

  localStorage.setItem(
    "daftarTodo",
    JSON.stringify(todo)
  );

  input.value = "";

  tampilkanTodo();
}

function tampilkanTodo() {
  const daftar = document.getElementById("daftarTodo");
  const todo = ambilTodo();

  daftar.innerHTML = "";

  if (todo.length === 0) {
    daftar.innerHTML =
      '<p style="text-align:center;color:#888;">Belum ada pekerjaan.</p>';
    return;
  }

  todo.forEach(function(item, index) {

    const div = document.createElement("div");
    div.className = "note";

    div.innerHTML = `
      <p>${item.tugas}</p>
      <small>${item.waktu}</small>
      <button class="delete" onclick="hapusTodo(${index})">
        🗑️ Hapus
      </button>
    `;

    daftar.appendChild(div);
  });
}

function hapusTodo(index) {
  const todo = ambilTodo();

  todo.splice(index, 1);

  localStorage.setItem(
    "daftarTodo",
    JSON.stringify(todo)
  );

  tampilkanTodo();
}

function kembali() {
  window.location.href = "ai-assistant.html";
}

tampilkanTodo();

</script>

</body>
</html>
