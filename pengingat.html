<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pengingat Pekerjaan</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 15px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    .simpan {
      background: #4caf50;
      color: white;
    }

    .kembali {
      background: #777;
      color: white;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🔔 Pengingat Pekerjaan</h1>

    <div class="card">

      <label for="pekerjaan">Nama Pekerjaan</label>
      <input
        type="text"
        id="pekerjaan"
        placeholder="Contoh: Follow-up customer"
      >

      <label for="tanggal">Tanggal</label>
      <input type="date" id="tanggal">

      <label for="waktu">Waktu</label>
      <input type="time" id="waktu">

      <label for="prioritas">Prioritas</label>
      <select id="prioritas">
        <option value="Normal">Normal</option>
        <option value="Penting">Penting</option>
        <option value="Mendesak">Mendesak</option>
      </select>

      <label for="catatan">Catatan</label>
      <textarea
        id="catatan"
        placeholder="Tuliskan detail pekerjaan..."
      ></textarea>

      <button class="simpan" onclick="simpanPengingat()">
        💾 Simpan Pengingat
      </button>

      <button class="kembali" onclick="kembaliHome()">
        🏠 Kembali ke Menu Utama
      </button>

    </div>

    <div class="card">
      <h2>📋 Daftar Pengingat</h2>

      <div id="daftarPengingat">
        Belum ada pengingat.
      </div>
    </div>

  </div>

  <script>

    function simpanPengingat() {
    const pekerjaan = document.getElementById("pekerjaan").value.trim();
    const tanggal = document.getElementById("tanggal").value;
    const waktu = document.getElementById("waktu").value;
    const prioritas = document.getElementById("prioritas").value;
    const catatan = document.getElementById("catatan").value.trim();

    if (pekerjaan === "" || tanggal === "" || waktu === "") {
        alert("Nama pekerjaan, tanggal, dan waktu wajib diisi.");
        return;
    }

    const data = {
        pekerjaan,
        tanggal,
        waktu,
        prioritas,
        catatan
    }

    let daftarPengingat = JSON.parse(localStorage.getItem("pengingat")) || [];

if (!Array.isArray(daftarPengingat)) {
    daftarPengingat = [daftarPengingat];
}

daftarPengingat.push(data);

localStorage.setItem("pengingat", JSON.stringify(daftarPengingat));

    alert("Pengingat berhasil disimpan.");
}
function tampilkanPengingat() {
    
    const data = JSON.parse(localStorage.getItem("pengingat")) || [];

    const daftar = document.getElementById("daftarPengingat");

    if (data.length === 0) {
        daftar.innerHTML = "Belum ada pengingat.";
        return;
    }

    daftar.innerHTML = data.map((item, index) => `
        <div class="card">
            <b>${item.pekerjaan}</b><br>
            📅 ${item.tanggal}<br>
            ⏰ ${item.waktu}<br>
            ⭐ ${item.prioritas}<br>
            📝 ${item.catatan}
            <button onclick="hapusPengingat(${index})">🗑️ Hapus</button>
        </div>
    `).join("");
}

tampilkanPengingat();
    function kembaliHome() {
      window.location.href = "index.html";
    }
function hapusPengingat(index) {
    let data = JSON.parse(localStorage.getItem("pengingat")) || [];

    data.splice(index, 1);

    localStorage.setItem("pengingat", JSON.stringify(data));

    tampilkanPengingat();
}
  </script>

</body>
</html>
