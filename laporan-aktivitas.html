<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Aktivitas</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 20px;
        }

        h1 {
            text-align: center;
        }

        .kosong {
            text-align: center;
            padding: 30px;
            color: #777;
        }

        .kembali {
            display: block;
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            border: none;
            border-radius: 10px;
            background: #777;
            color: white;
            font-size: 16px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>📊 Laporan Aktivitas</h1>

    <div id="daftarLaporan"></div>
    <button class="kembali" onclick="kembaliHome()">
        🏠 Kembali ke Menu Utama
    </button>

</div>

<script>
function kembaliHome() {
    window.location.href = "index.html";
}
    function tampilkanLaporan() {

    const daftar = document.getElementById("daftarLaporan");

    const semuaLaporan =
        JSON.parse(localStorage.getItem("laporanAktivitas")) || [];

    if (semuaLaporan.length === 0) {
        daftar.innerHTML = "<div class='kosong'>Belum ada laporan aktivitas.</div>";
        return;
    }

    daftar.innerHTML = semuaLaporan.map((laporan, index) => `
        <div class="laporan">
            <h3>📋 Laporan #${index + 1}</h3>
            <p><strong>👤 Customer:</strong> ${laporan.nama}</p>
            <p><strong>💡 Kebutuhan:</strong> ${laporan.kebutuhan}</p>
            <p><strong>📦 Produk:</strong> ${laporan.produk}</p>
            <p><strong>💬 Hasil Chat:</strong> ${laporan.hasilChat}</p>
            <p><strong>🕐 Waktu:</strong> ${laporan.waktu}</p>
        </div>
    `).join("");
}

tampilkanLaporan();
</script>

</body>
</html>
